name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_API }}
          command: pages deploy dist --project-name=phlabs --branch=main --commit-dirty=true

      - name: Purge Cloudflare edge cache (scoped — HTML + feeds only)
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_PHLABS }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID_PHLABS secret not set — skipping edge cache purge"
            exit 0
          fi
          # Scoped purge: HTML + feeds only. NEVER purge_everything — hashed
          # /assets/* are content-hashed + immutable and must survive every
          # deploy, otherwise users with an already-open page get chunk 404
          # → blank page. See .lovable/memory/post-publish-edge-purge.md.
          resp=$(curl -sS -o /tmp/purge.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://phlabs.co.uk/","https://phlabs.co.uk/products","https://phlabs.co.uk/sitemap.xml","https://phlabs.co.uk/robots.txt","https://phlabs.co.uk/llms.txt","https://phlabs.co.uk/google-merchant-feed.xml","https://phlabs.co.uk/google-merchant-feed-free.xml","https://phlabs.co.uk/feed.xml"]}')
          echo "HTTP $resp"
          cat /tmp/purge.json
          if [ "$resp" != "200" ]; then
            echo "::error::Cache purge failed"
            exit 1
          fi
          echo "✅ Edge cache purged (scoped)"

      - name: Trigger post-publish invalidation (worker edge + prerender recache)
        if: success()
        run: |
          set -euo pipefail
          # The public post-publish endpoint compares the live server build id
          # with Firestore _meta/build_state and, on change, purges CF edge,
          # refreshes the worker edge-html cache and recaches prerender.io.
          # Without an explicit call the HTML flip lagged the server deploy by
          # >2h (observed 2026-11-10) — stale HTML pointing at deleted chunks.
          for i in 1 2 3 4 5 6; do
            resp=$(curl -sS --max-time 60 "https://phlabs.co.uk/api/public/post-publish-check" || true)
            echo "attempt $i: $resp"
            if echo "$resp" | grep -q '"ok":true'; then
              echo "post-publish endpoint acknowledged (see changed/invalidated flags above)"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::post-publish-check unreachable — HTML may stay stale until the worker build-id probe evicts it"
