name: Reindex Hook E2E

on:
  pull_request:
    paths:
      - 'src/routes/api/public/hooks/reindex.ts'
      - 'src/pages/Admin/tabs/ReindexHookTab.tsx'
      - 'src/lib/reindex.functions.ts'
      - 'e2e/reindex-hook.spec.ts'
      - 'e2e/admin-reindex-flow.spec.ts'
      - '.github/workflows/reindex-hook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: http://localhost:8080
      PRERENDER_TOKEN: ${{ secrets.PRERENDER_TOKEN }}
      BING_INDEXNOW_API_KEY: ${{ secrets.BING_INDEXNOW_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - run: bash scripts/ci-bun-install.sh
      # The suite runs all three browser projects — chromium alone leaves
      # firefox/webkit failing with "Executable doesn't exist".
      - run: bunx playwright install --with-deps chromium firefox webkit

      - name: Start local dev server for Playwright
        # bun run preview looks for dist/server/server.js, which this nitro
        # build never emits (it writes .output/) — every API route then 500s
        # with ERR_MODULE_NOT_FOUND. The other e2e workflows use vite dev.
        run: |
          (bun run dev --host 127.0.0.1 --port 8080 > server.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8080/"; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; tail -n 200 server.log; exit 1

      - name: Probe POST handling (diagnostic)
        run: |
          echo "--- POST no-auth probe ---"
          curl -sS -i -X POST http://localhost:8080/api/public/hooks/reindex \
            -H 'content-type: application/json' \
            -d '{"urls":["/"]}' | head -30
          echo "--- GET health probe ---"
          curl -sS -i http://localhost:8080/api/public/health/build | head -12

      - name: Run reindex contract tests
        run: bunx playwright test e2e/reindex-hook.spec.ts e2e/admin-reindex-flow.spec.ts --reporter=list,html

      - name: Upload Playwright report + traces + videos + JSON bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reindex-hook-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
