name: Worker bindings check (royal-mail-order)

# Diagnostic: lists the binding/secret NAMES configured on the royal-mail-order
# Worker (values are never exposed by the Cloudflare API). Used to verify that
# ROYAL_MAIL_CLIENT_ID / ROYAL_MAIL_CLIENT_SECRET actually exist after a
# dashboard/wrangler deploy cycle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List worker settings (bindings)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_API }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/royal-mail-order/settings" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not d.get('success'):
              print('API ERROR:', json.dumps(d.get('errors'), indent=2)); sys.exit(1)
          bindings = d.get('result', {}).get('bindings', [])
          print('Bindings on royal-mail-order:')
          for b in bindings:
              print(f\"  - {b.get('name')}  (type: {b.get('type')})\")
          names = {b.get('name') for b in bindings}
          for want in ['ROYAL_MAIL_API_KEY', 'SHARED_SECRET', 'ROYAL_MAIL_CLIENT_ID', 'ROYAL_MAIL_CLIENT_SECRET']:
              print(('OK   ' if want in names else 'MISS ') + want)
          "
