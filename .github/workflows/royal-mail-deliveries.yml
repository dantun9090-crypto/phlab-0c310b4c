name: Royal Mail Delivery Sync

# Every 4 hours: asks the app to check Royal Mail tracking for shipped
# orders and mark delivered parcels as `delivered` (status email +
# referral reward are handled server-side by the route).
# Auth: x-cron-secret header (CRON_SECRET GitHub secret).

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: royal-mail-deliveries
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 3 attempts x up-to-300s curl + backoff need headroom over the old 10min.
    timeout-minutes: 20
    steps:
      - name: POST royal-mail-deliveries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not configured — cannot run sync." >&2
            exit 1
          fi
          attempt=1
          max=3
          while : ; do
            resp=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://phlabs.co.uk/api/admin/royal-mail-deliveries" \
              -H "content-type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              --max-time 300 \
              --data '{}') || resp="000"
            echo "attempt ${attempt}/${max}: HTTP $resp"
            cat /tmp/resp.json || true
            echo
            # 2xx = success. 5xx/000 (incl. Cloudflare 524 origin timeout —
            # seen in run 36000401966) are transient infra errors worth a
            # retry. 4xx is a real failure — do not retry.
            case "$resp" in
              2*) exit 0 ;;
              4*) exit 1 ;;
            esac
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::sync failed after ${max} attempts (last HTTP $resp)"
              exit 1
            fi
            attempt=$((attempt+1))
            echo "sleeping 60s before retry..."
            sleep 60
          done
