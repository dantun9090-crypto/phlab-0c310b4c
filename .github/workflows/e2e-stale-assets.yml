name: E2E — stale-asset recovery

# Verifies the post-publish auto-purge + stale-chunk self-heal flow:
#   * JS chunk 404, CSS link error, sourcemap 404
#   * cross-tab and network-failure locks
# Runs nightly + on PRs that touch the affected client/server code.

on:
  # Deliberately NOT run on pull_request: this suite drives real traffic at
  # https://phlabs.co.uk and repeated per-deploy runs tripped the Cloudflare WAF
  # rate limit for GitHub runner IPs (403 on the document). Once a day is enough
  # for a regression guard; use workflow_dispatch for on-demand checks.
  schedule:
    # Nightly at 04:07 UTC — offset from the survey suite to spread load.
    - cron: "7 4 * * *"
  workflow_dispatch:


concurrency:
  group: e2e-stale-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional — when set, the report includes before/after DB diffs of
      # _meta/build_state. Without it the rest of the suite still runs.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      # The prod build targets the Cloudflare Workers Nitro preset — there is
      # no node-runnable server for CI to host, and the dev server does not
      # inject the production build-killer/stale-asset recovery scripts this
      # probe asserts on. Run against live instead (read-only browser
      # traffic; "stale" assets are faked via Playwright route interception).
      TARGET_URL: https://phlabs.co.uk
      # Matches the "Allow PH Labs E2E runner" skip rule on the Cloudflare zone
      # so runner IPs are not rate-limited/403'd by the WAF.
      PHL_E2E_BYPASS_TOKEN: ${{ secrets.PHL_E2E_BYPASS_TOKEN }}
      E2E_REPORT_DIR: ${{ github.workspace }}/e2e-stale-report



    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bash scripts/ci-bun-install.sh

      - name: Install Playwright (Node + Chromium)
        run: bunx playwright install --with-deps chromium



      - name: Run E2E stale-assets probe
        run: node scripts/e2e-stale-assets.mjs

      - name: Upload E2E stale-assets report (HTML/JUnit/console)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stale-assets-report
          path: ${{ env.E2E_REPORT_DIR }}
          if-no-files-found: ignore

      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ${{ env.E2E_REPORT_DIR }}/junit.xml
          check_name: e2e-stale-assets
          fail_on_failure: true
          require_tests: false

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stale-assets-server-log
          path: server.log
          if-no-files-found: ignore
