version: 2
# Automatically opens PRs to update vulnerable / outdated dependencies.
# PRs are gated by the existing CI (typecheck + build + security-scan)
# defined in .github/workflows/ci.yml, so a vulnerable update can never
# silently land on main.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "deps"
      include: scope
    # Keep our hardened overrides (undici, ws, dompurify, etc.) bumped
    # rather than ignored — Dependabot will retarget the override range
    # as new patched versions ship.
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      # react-start 1.169.x removed ServerFnBuilder.inputValidator AND broke
      # vite entry resolution with @lovable.dev/vite-tanstack-config
      # ("Could not resolve entry module index.html") — see #898/#910.
      # Stay on 1.168.x until the Lovable wrapper supports the 1.169 entry
      # contract; 1.170+ proposals are still allowed through.
      - dependency-name: "@tanstack/react-start"
        versions: ["1.169.x"]
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      tanstack:
        patterns:
          - "@tanstack/*"
      radix:
        patterns:
          - "@radix-ui/*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-admin"
          - "@firebase/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
